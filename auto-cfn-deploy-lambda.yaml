AWSTemplateFormatVersion: '2010-09-09'
Description: >
  S3-triggered Lambda to deploy CloudFormation stacks from uploaded templates,
  stack name derived from uploaded file name.

Parameters:
  EnvName:
    Type: String
    Default: dev
    Description: Environment prefix
  S3BucketName:
    Type: String
    Default: ' '
    Description: Name of the S3 bucket to receive templates (must be globally unique)

Resources:
  # S3 bucket with versioning and lifecycle rule
  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref S3BucketName
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: AutoDelete
            Status: Enabled
            ExpirationInDays: 90
            Prefix: ""
            NoncurrentVersionExpirationInDays: 90

  # Lambda IAM Role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvName}-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/PowerUserAccess

  # Lambda Function
  ProcessFileFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - LambdaExecutionRole
    Properties:
      FunctionName: !Sub '${EnvName}-cfn-deploy'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 900
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref S3BucketName
      Code:
        ZipFile: |
          import boto3
          import os
          import json

          s3 = boto3.client('s3')
          cfn = boto3.client('cloudformation')

          def handler(event, context):
              print("Received event:", json.dumps(event))

              try:
                  record = event['detail']
                  bucket = record['bucket']['name']
                  key = record['object']['key']

                  print(f"Bucket: {bucket}, Key: {key}")

                  if bucket != os.environ.get('S3_BUCKET_NAME'):
                      print(f"Ignored event from bucket {bucket}")
                      return

                  if not (key.endswith('.yaml') or key.endswith('.yml') or key.endswith('.json')):
                      print(f"Skipping unsupported file {key}")
                      return

                  response = s3.get_object(Bucket=bucket, Key=key)
                  content = response['Body'].read().decode('utf-8')

                  stack_name = os.path.splitext(os.path.basename(key))[0]
                  print(f"Stack name: {stack_name}")

                  if key.endswith('.json'):
                      template_body = json.dumps(json.loads(content))
                  else:
                      template_body = content

                  try:
                      cfn.describe_stacks(StackName=stack_name)
                      print(f"Stack exists, updating stack {stack_name}")
                      cfn.update_stack(
                          StackName=stack_name,
                          TemplateBody=template_body,
                          Capabilities=['CAPABILITY_NAMED_IAM']
                      )
                      waiter = cfn.get_waiter('stack_update_complete')
                  except cfn.exceptions.ClientError as e:
                      if 'does not exist' in str(e):
                          print(f"Stack does not exist, creating stack {stack_name}")
                          cfn.create_stack(
                              StackName=stack_name,
                              TemplateBody=template_body,
                              Capabilities=['CAPABILITY_NAMED_IAM']
                          )
                          waiter = cfn.get_waiter('stack_create_complete')
                      elif 'No updates are to be performed' in str(e):
                          print(f"No updates to perform on stack {stack_name}")
                          return
                      else:
                          raise

                  waiter.wait(StackName=stack_name)
                  print(f"Stack operation completed: {stack_name}")

              except Exception as e:
                  print(f"Error processing event: {e}")
                  raise

  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${EnvName}-cfn-deploy'
      RetentionInDays: 7

  # Permission for EventBridge to invoke Lambda
  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProcessFileFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt 'S3UploadEventRule.Arn'

  # EventBridge Rule to trigger Lambda on S3 object
  S3UploadEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${EnvName}-s3up-rule'
      Description: Trigger Lambda on new CFN template upload
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - Object Created
        detail:
          bucket:
            name:
              - !Ref S3BucketName
      Targets:
        - Arn: !GetAtt ProcessFileFunction.Arn
          Id: "ProcessFileLambdaTarget"

Outputs:
  S3BucketName:
    Description: S3 bucket name
    Value: !Ref S3Bucket
  LambdaFunctionName:
    Description: Lambda function name
    Value: !Ref ProcessFileFunction
  EventRuleName:
    Description: EventBridge rule name
    Value: !Ref S3UploadEventRule
