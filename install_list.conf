# ------------------------------------------------------------
# 工具安装清单列表（install_list.conf）
# 按行定义需要安装的组件及格式，支持如下类型：
#
# 1. 主程序安装（可指定版本）：
#    格式：软件名=版本号（可省略版本号表示安装最新版）
#
# 2. PHP 扩展安装：
#    格式：php-ext:扩展名
#
# 3. Python 扩展安装：
#    格式：python-pkg:扩展名
#
# 4. 指定 RPM 包安装：
#    格式：rpm:完整包名
#
# 5. 自定义命令安装（例如下载/构建/容器）：
#    格式：custom:名称=| 命令（多个命令可用 && 或换行方式）
# ------------------------------------------------------------

# === 主程序安装示例 ===
apache=2.4         # 安装 Apache 2.4
php-fpm=8.4        # 安装 PHP-FPM 8.4（自动识别 OS 区分包名）
awscli             # 安装最新版 AWS CLI
java-17-openjdk    # 安装 OpenJDK 17

# === PHP 扩展安装示例（会自动拼接版本号）===
php-ext:mbstring   # 安装 PHP 的 mbstring 扩展
php-ext:zip        # 安装 PHP 的 zip 扩展
php-ext:curl       # 安装 PHP 的 curl 扩展

# === Python 模块扩展安装（通过 pip 安装）===
python-pkg:requests   # 安装 Python 的 requests 扩展
python-pkg:numpy      # 安装 Python 的 numpy 扩展
python-pkg:pandas     # 安装 Python 的 pandas 扩展

# === RPM 安装包（精确包名）===
rpm:php84-php-cli.x86_64
rpm:php84-php-common.x86_64

# === 自定义命令安装示例 ===
# 以下为 DynamoDB Local 的示例，自行定义名称和安装逻辑
custom:dynamolocal=| mkdir -p /opt/dynamodb && cd /opt/dynamodb && curl -O https://s3.us-west-2.amazonaws.com/dynamodb-local/dynamodb_local_latest.tar.gz && tar -xzf dynamodb_local_latest.tar.gz

# DynamoDB Admin (Node.js 应用)
custom:dynamodb-admin=| npm install -g dynamodb-admin

# MinIO S3 服务端
custom:minio=| curl -O https://dl.min.io/server/minio/release/linux-amd64/minio && chmod +x minio && mv minio /usr/local/bin/ && useradd -r minio-user && mkdir -p /usr/local/share/minio /etc/minio && chown minio-user:minio-user /usr/local/share/minio /etc/minio

# === 注意事项 ===
# - 空行与 # 开头为注释，会自动跳过
# - 版本号（如 php-fpm=8.4）仅在支持该格式的软件上有效
# - PHP 扩展无需带 php- 前缀（脚本会根据系统自动补全）
# - rpm: 前缀用于精确安装 yum/dnf 包（不能缺失架构后缀）
# - custom: 用于执行任意 bash 命令，使用 =| 分隔键值
