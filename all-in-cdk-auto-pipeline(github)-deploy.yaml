AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CodePipeline for CDK project that listens to a GitHub repository main branch,
  with manual approval, and CodeBuild performing build & deploy.
  Environment variable ENV is passed dynamically to CodeBuild.
  Logs retention days parameterized.
  Source is GitHub, using OAuth token from Secrets Manager.

Parameters:
  EnvName:
    Type: String
    Default: dev
    Description: Environment name passed as ENV variable to CodeBuild (e.g. dev,stg,prod)
  GitHubOwner:
    Type: String
    Description: GitHub repository owner (user or org)
  GitHubRepo:
    Type: String
    Description: GitHub repository name
  GitHubBranch:
    Type: String
    Default: main
    Description: GitHub branch name to monitor
  GitHubOAuthTokenSecretName:
    Type: String
    Description: Secrets Manager secret name storing GitHub OAuth token
  LogRetentionDays:
    Type: Number
    Default: 60
    AllowedValues: [1,3,5,7,14,30,60,90,120,150,180,365]
    Description: Number of days to retain CloudWatch logs

Resources:

  # Artifact bucket for pipeline artifacts
  PipelineArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      LifecycleConfiguration:
        Rules:
          - Id: ExpireArtifactsAfter30Days
            Status: Enabled
            ExpirationInDays: 30
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
    DeletionPolicy: Retain

  # CloudWatch LogGroup for CodeBuild logs
  PipelineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/codebuild/${GitHubRepo}-${GitHubBranch}-build
      RetentionInDays: !Ref LogRetentionDays

  # Role for CodeBuild with needed permissions
  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${GitHubRepo}-BuildRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildPermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - s3:GetObject
                  - s3:PutObject
                  - s3:GetObjectVersion
                  - s3:GetBucketVersioning
                  - cloudformation:*
                  - sts:AssumeRole
                  - iam:PassRole
                Resource: "*"

  # CodeBuild Project for CDK build and deploy
  CDKBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub ${GitHubRepo}-build
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Source:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: ENV
            Value: !Ref EnvName
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref PipelineLogGroup
          StreamName: build-log
      TimeoutInMinutes: 30
      Artifacts:
        Type: CODEPIPELINE
      Cache:
        Type: S3
        Location: !Ref PipelineArtifactBucket
      BuildSpec: |
        version: 0.2

        phases:
          install:
            runtime-versions:
              nodejs: 18
            commands:
              - echo "[Install] Installing global dependencies"
              - npm install -g aws-cdk
              - echo "[Install] Installing project dependencies"
              - if [ -f package.json ]; then npm install; fi
              - if [ -f requirements.txt ]; then
                  echo "Python project detected. Installing dependencies...";
                  pip3 install -r requirements.txt || pip install -r requirements.txt;
                fi

          pre_build:
            commands:
              - echo "[PreBuild] ENV set to $ENV"
              - echo "[PreBuild] Synthesizing CDK..."
              - cdk synth

          build:
            commands:
              - echo "[Build] Bootstrapping if necessary..."
              - cdk bootstrap
              - echo "[Build] Deploying CDK stacks..."
              - |
                set -e
                if ! cdk deploy --require-approval never --all; then
                  echo "❌ CDK deploy failed. Dumping templates for debug:"
                  find cdk.out -name "*.template.json" -exec cat {} \;
                  exit 1
                else
                  echo "✅ CDK deploy completed successfully"
                fi

        artifacts:
          files:
            - '**/*'
          discard-paths: yes

        cache:
          paths:
            - 'node_modules/**/*'
            - '.venv/**/*'

  # Role for CodePipeline with necessary permissions
  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${GitHubRepo}-PipelineRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PipelinePermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:*
                  - codebuild:*
                  - iam:PassRole
                  - codepipeline:StartPipelineExecution
                Resource: "*"

  # CodePipeline that integrates GitHub source, manual approval, and build/deploy
  CDKPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub ${GitHubRepo}-pipeline
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref PipelineArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: GitHubSource
              ActionTypeId:
                Category: Source
                Owner: ThirdParty
                Provider: GitHub
                Version: '1'
              OutputArtifacts:
                - Name: SourceOutput
              Configuration:
                Owner: !Ref GitHubOwner
                Repo: !Ref GitHubRepo
                Branch: !Ref GitHubBranch
                OAuthToken: !Sub '{{resolve:secretsmanager:${GitHubOAuthTokenSecretName}:SecretString:token}}'
                PollForSourceChanges: false
              RunOrder: 1

        - Name: Approve
          Actions:
            - Name: ManualApproval
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: '1'
              RunOrder: 1

        - Name: BuildAndDeploy
          Actions:
            - Name: BuildAndDeployCDK
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildOutput
              Configuration:
                ProjectName: !Ref CDKBuildProject
              RunOrder: 1

Outputs:
  PipelineName:
    Description: Name of the CodePipeline
    Value: !Ref CDKPipeline
  BuildProject:
    Description: CodeBuild project name
    Value: !Ref CDKBuildProject
  LogGroup:
    Description: Log group name for build logs
    Value: !Ref PipelineLogGroup
  ArtifactBucket:
    Description: S3 Bucket for pipeline artifacts
    Value: !Ref PipelineArtifactBucket
