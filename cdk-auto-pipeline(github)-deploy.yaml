AWSTemplateFormatVersion: '2010-09-09'
Description: >
  GitHub-triggered CodePipeline for CDK project with Secrets Manager integration.
  Includes manual approval, S3 artifact bucket, CodeBuild for synth/deploy,
  and CloudWatch Logs with configurable retention.

Parameters:
  EnvName:
    Type: String
    Default: dev
    Description: Environment name passed to CDK (e.g. dev, stg, prod)
  GitHubOwner:
    Type: String
    Default: github-username
    Description: GitHub username or organization name
  GitHubRepo:
    Type: String
    Default: github-repo-name
    Description: GitHub repository name
  GitHubBranch:
    Type: String
    Default: main
    Description: GitHub branch to monitor (e.g. main, dev)
  GitHubTokenSecretId:
    Type: String
    Default: github-token
    Description: Secrets Manager secret name containing GitHub OAuth token
  LogRetentionDays:
    Type: Number
    Default: 60
    AllowedValues: [1,3,5,7,14,30,60,90,120,150,180,365]
    Description: Number of days to retain CodeBuild logs

Resources:
  ### Artifact S3 Bucket ###
  PipelineArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      LifecycleConfiguration:
        Rules:
          - Id: ExpireArtifactsAfter30Days
            Status: Enabled
            ExpirationInDays: 30
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
    DeletionPolicy: Retain

  ### CodeBuild Logs ###
  PipelineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/codebuild/${GitHubRepo}-${GitHubBranch}-build
      RetentionInDays: !Ref LogRetentionDays

  ### CodeBuild IAM Role ###
  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${GitHubRepo}-BuildRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildPermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - s3:GetObject
                  - s3:PutObject
                  - s3:GetObjectVersion
                  - s3:GetBucketVersioning
                  - cloudformation:*
                  - sts:AssumeRole
                  - iam:PassRole
                Resource: "*"

  ### CodeBuild Project ###
  CDKBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub ${GitHubRepo}-build
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Source:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: ENV
            Value: !Ref EnvName
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref PipelineLogGroup
          StreamName: build-log
      TimeoutInMinutes: 30
      Artifacts:
        Type: CODEPIPELINE
      Cache:
        Type: S3
        Location: !Ref PipelineArtifactBucket
      BuildSpec: !Sub |
        version: 0.2
        phases:
          install:
            commands:
              - npm install -g aws-cdk
              - if [ -f package.json ]; then npm install; fi
              - if [ -f requirements.txt ]; then pip3 install -r requirements.txt || pip install -r requirements.txt; fi
          pre_build:
            commands:
              - echo "Synthesizing CDK app..."
              - cdk synth
          build:
            commands:
              - cdk bootstrap
              - cdk deploy --require-approval never --all

  ### CodePipeline IAM Role ###
  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${GitHubRepo}-PipelineRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PipelinePermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:*
                  - codebuild:*
                  - iam:PassRole
                  - codepipeline:StartPipelineExecution
                  - secretsmanager:GetSecretValue
                Resource: "*"

  ### GitHub Token Secret ###
  GitHubTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Ref GitHubTokenSecretId
      Description: GitHub OAuth Token used by CodePipeline
      SecretString: !Sub |
        {
          "OAuthToken": "REPLACE_ME_WITH_YOUR_GITHUB_TOKEN"
        }

  ### CodePipeline ###
  CDKPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub ${GitHubRepo}-pipeline
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref PipelineArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: GitHubSource
              ActionTypeId:
                Category: Source
                Owner: ThirdParty
                Provider: GitHub
                Version: '1'
              OutputArtifacts:
                - Name: SourceOutput
              Configuration:
                Owner: !Ref GitHubOwner
                Repo: !Ref GitHubRepo
                Branch: !Ref GitHubBranch
                OAuthToken: !Sub '{{resolve:secretsmanager:${GitHubTokenSecretId}:SecretString:OAuthToken}}'
                PollForSourceChanges: false
              RunOrder: 1

        - Name: Approve
          Actions:
            - Name: ManualApproval
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: '1'
              RunOrder: 1

        - Name: BuildAndDeploy
          Actions:
            - Name: BuildAndDeployCDK
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildOutput
              Configuration:
                ProjectName: !Ref CDKBuildProject
              RunOrder: 1

Outputs:
  PipelineName:
    Description: Name of the CodePipeline
    Value: !Ref CDKPipeline
  BuildProject:
    Description: CodeBuild project name
    Value: !Ref CDKBuildProject
  LogGroup:
    Description: Log group name for build logs
    Value: !Ref PipelineLogGroup
  ArtifactBucket:
    Description: S3 Bucket for pipeline artifacts
    Value: !Ref PipelineArtifactBucket
  GitHubTokenSecret:
    Description: Name of the created GitHub token Secret
    Value: !Ref GitHubTokenSecret
